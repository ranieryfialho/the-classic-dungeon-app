<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Classic Dungeon</title>
    <!-- Adicione estas meta tags no <head> do seu index.html -->

    <!-- Meta tags essenciais para mobile -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="The Classic Dungeon" />
    <meta name="theme-color" content="#0B0B0F" />
    <meta name="msapplication-navbutton-color" content="#0B0B0F" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Previne zoom automático em inputs no iOS -->
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA básico -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Ícones para diferentes dispositivos -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Splash screens para iOS (opcional) -->
    <link rel="apple-touch-startup-image" href="/splash-screen.png" />

    <!-- Desabilita seleção de texto em elementos UI -->
    <style>
      /* Adicione ao CSS global */
      .no-select {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      /* Melhora o scrolling no iOS */
      html {
        -webkit-overflow-scrolling: touch;
        overflow-scrolling: touch;
      }

      /* Previne o bounce do iOS */
      body {
        overscroll-behavior-y: none;
        -webkit-overflow-scrolling: touch;
      }

      /* Remove highlights de toque padrão */
      * {
        -webkit-tap-highlight-color: transparent;
      }

      /* Melhora performance em mobile */
      .gpu-layer {
        transform: translateZ(0);
        will-change: transform;
      }

      /* Safe areas para dispositivos com notch */
      .safe-top {
        padding-top: env(safe-area-inset-top);
      }

      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }

      .safe-left {
        padding-left: env(safe-area-inset-left);
      }

      .safe-right {
        padding-right: env(safe-area-inset-right);
      }

      /* Correção para altura 100vh no mobile */
      .full-height {
        height: 100vh;
        height: -webkit-fill-available;
      }

      /* Minimum viable mobile experience */
      @media (max-width: 480px) {
        .mobile-hidden {
          display: none !important;
        }

        .mobile-full-width {
          width: 100% !important;
        }

        .mobile-text-sm {
          font-size: 0.875rem !important;
        }

        .mobile-p-2 {
          padding: 0.5rem !important;
        }

        .mobile-gap-2 {
          gap: 0.5rem !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
